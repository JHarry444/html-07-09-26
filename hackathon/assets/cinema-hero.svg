<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Cinema audience in front of a movie screen</title>
  <desc id="desc">Illustration of cinema seats and audience silhouettes facing a large screen with warm spotlights.</desc>
  <defs>
    <linearGradient id="screenGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe9c5"/>
      <stop offset="100%" stop-color="#ffd39e"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f3553"/>
      <stop offset="100%" stop-color="#102338"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1b2b"/>
      <stop offset="100%" stop-color="#070f19"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="700" fill="url(#wall)"/>
  <rect x="90" y="60" width="1020" height="320" rx="20" fill="#0b1625" stroke="#284766" stroke-width="8"/>
  <rect x="130" y="95" width="940" height="250" rx="12" fill="url(#screenGlow)"/>

  <path d="M0 470 Q600 390 1200 470 V700 H0 Z" fill="url(#floor)"/>

  <g fill="#8b2f22" opacity="0.94">
    <rect x="110" y="470" width="140" height="110" rx="12"/>
    <rect x="285" y="450" width="140" height="130" rx="12"/>
    <rect x="460" y="435" width="140" height="145" rx="12"/>
    <rect x="635" y="435" width="140" height="145" rx="12"/>
    <rect x="810" y="450" width="140" height="130" rx="12"/>
    <rect x="985" y="470" width="140" height="110" rx="12"/>
  </g>

  <g fill="#0a121d">
    <circle cx="225" cy="470" r="24"/>
    <rect x="205" y="492" width="40" height="62" rx="18"/>
    <circle cx="360" cy="445" r="28"/>
    <rect x="336" y="472" width="48" height="76" rx="20"/>
    <circle cx="530" cy="428" r="30"/>
    <rect x="504" y="458" width="52" height="84" rx="22"/>
    <circle cx="705" cy="428" r="30"/>
    <rect x="679" y="458" width="52" height="84" rx="22"/>
    <circle cx="875" cy="445" r="28"/>
    <rect x="851" y="472" width="48" height="76" rx="20"/>
    <circle cx="1010" cy="470" r="24"/>
    <rect x="990" y="492" width="40" height="62" rx="18"/>
  </g>

  <g opacity="0.27" fill="#ffffff">
    <circle cx="340" cy="190" r="14"/>
    <circle cx="865" cy="220" r="18"/>
    <circle cx="670" cy="170" r="12"/>
  </g>
</svg>