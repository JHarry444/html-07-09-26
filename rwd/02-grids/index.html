<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Grid Calculator</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            font-family: Arial, Helvetica, sans-serif;
        }

        .calculator {
            width: min(90vw, 360px);
            background: #111827;
            border-radius: 24px;
            padding: 22px;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
        }

        .display {
            width: 100%;
            min-height: 90px;
            background: #f8fafc;
            border-radius: 16px;
            display: flex;
            align-items: end;
            justify-content: flex-end;
            padding: 18px 16px;
            margin-bottom: 20px;
            font-size: clamp(2rem, 5vw, 2.5rem);
            font-weight: 700;
            color: #0f172a;
            overflow: hidden;
        }



        button {
            border: none;
            border-radius: 16px;
            padding: 18px 10px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.15s ease, opacity 0.15s ease;
        }

        button:hover {
            transform: translateY(-1px);
            opacity: 0.96;
        }

        button:active {
            transform: translateY(0);
        }

        .operator {
            background: #c7d2fe;
            color: #1e1b4b;
        }

        .number {
            background: #e2e8f0;
            color: #0f172a;
        }

        .clear {
            background: #fca5a5;
            color: #7f1d1d;
        }


        .equals {
            background: linear-gradient(135deg, #8b5cf6, #4f46e5);
            color: white;
        }

        /* .keys {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
        }

        .equals {
            grid-column: span 2;
        }

        .zero {
            grid-column: span 2;
        } */

        .keys {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        button {
            width: 22%;
        }

        .equals {
            width: 48%;
        }

        .zero {
            width: 48%;
        }
    </style>
</head>

<body>
    <div class="calculator">
        <div class="display" id="display">0</div>

        <div class="keys">
            <button class="clear" data-action="clear">C</button>
            <button class="operator" data-action="delete">DEL</button>
            <button class="operator" data-value="/">÷</button>
            <button class="operator" data-value="*">×</button>

            <button class="number" data-value="7">7</button>
            <button class="number" data-value="8">8</button>
            <button class="number" data-value="9">9</button>
            <button class="operator" data-value="-">−</button>

            <button class="number" data-value="4">4</button>
            <button class="number" data-value="5">5</button>
            <button class="number" data-value="6">6</button>
            <button class="operator" data-value="+">+</button>

            <button class="number" data-value="1">1</button>
            <button class="number" data-value="2">2</button>
            <button class="number" data-value="3">3</button>

            <button class="number" data-value=".">.</button>
            <button class="number zero" data-value="0">0</button>
            <button class="equals" data-action="equals">=</button>

        </div>
    </div>

    <script>
        const display = document.getElementById('display');
        const buttons = document.querySelectorAll('button');
        let expression = '';

        function updateDisplay() {
            display.textContent = expression || '0';
        }

        buttons.forEach(button => {
            button.addEventListener('click', () => {
                const value = button.dataset.value;
                const action = button.dataset.action;

                if (value) {
                    expression += value;
                }

                if (action === 'clear') {
                    expression = '';
                }

                if (action === 'delete') {
                    expression = expression.slice(0, -1);
                }

                if (action === 'equals') {
                    try {
                        const result = Function(`"use strict"; return (${expression})`)();
                        expression = Number.isFinite(result) ? String(result) : 'Error';
                    } catch {
                        expression = 'Error';
                    }
                }

                updateDisplay();
            });
        });
    </script>
</body>

</html>
