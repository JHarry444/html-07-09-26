<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>

<body>
    <h1>Tables</h1>
    <h3>Tables</h3>

    <section>
        <p>This is the tables page.</p>
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Specialty</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Jordan Harrison</td>
                    <td>32</td>
                    <td>Java</td>
                </tr>
                <tr>
                    <td>CG</td>
                    <td>33</td>
                    <td>Web</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="3">
                        Spans the whole row
                    </td>
                </tr>
            </tfoot>
            <caption>Trainers</caption>
        </table>
    </section>
</body>

</html>
